
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI | Grupo 5 - PUCP 2026</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            color: #203864;
        }

        header {
            background: #203864;
            color: white;
            padding: 35px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
            color: #e5eaf2;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        nav a {
            color: #203864;
            text-decoration: none;
            font-weight: bold;
            margin: 0 12px;
            display: inline-block;
            padding: 6px;
        }

        nav a:hover {
            color: #0078d4;
        }

        main {
            max-width: 1350px;
            margin: auto;
            padding: 20px;
        }

        .seccion-titulo {
            text-align: center;
            margin: 35px 0 25px;
            font-size: 26px;
        }

        section {
            scroll-margin-top: 85px;
        }

        .dashboard {
            background: white;
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .dashboard h3 {
            text-align: center;
            font-size: 20px;
            margin: 10px 0 20px;
        }

        .dashboard img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 5px;
        }

        .error {
            color: #b42318;
            padding: 15px;
            text-align: center;
        }

        footer {
            text-align: center;
            background: #203864;
            color: white;
            padding: 25px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 24px;
            }

            nav a {
                margin: 5px;
                font-size: 13px;
            }

            main {
                padding: 10px;
            }

            .dashboard {
                padding: 10px;
            }

            .dashboard h3 {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Análisis de Conversión eCommerce</h1>
    <p>Trabajo Final - Grupo 5 | PUCP 2026</p>
</header>

<nav>
    <a href="#introduccion">Presentación</a>
    <a href="#preguntas">Preguntas y detalles</a>
</nav>

<main>

    <!-- PÁGINAS INICIALES -->
    <section id="introduccion">
        <h2 class="seccion-titulo">
            Presentación del proyecto
        </h2>

        <div id="paginas-iniciales"></div>
    </section>

    <!-- PREGUNTAS Y DETALLES -->
    <section id="preguntas">
        <h2 class="seccion-titulo">
            Análisis de resultados
        </h2>

        <div id="reportes"></div>
    </section>

</main>

<footer>
    Trabajo Final - Grupo 5 | PUCP 2026
</footer>

<script>

    // 1. PÁGINAS INICIALES
    const paginasIniciales = [
        ["Página 1", "pagina1.png"],
        ["CASO DEL NEGOCIO", "casodelnegocio.png"],
        ["INDICADOR", "indicador.png"],
        ["DASHBOARD", "dashboard.png"],
        ["REPORTE", "reporte.png"]
    ];

    // 2. PREGUNTAS Y DETALLES
    const reportes = [

        // PREGUNTA 1
        ["Pregunta 1", "pregunta1.png"],
        ["Pregunta 1 (2)", "pregunta1(2).png"],
        ["Detalle 1", "detalle1.png"],
        ["Detalle 8", "detalle8.png"],

        // PREGUNTA 2
        ["Pregunta 2", "pregunta2.png"],

        // PREGUNTA 3
        ["Pregunta 3", "pregunta3.png"],

        // PREGUNTA 4
        ["Pregunta 4", "pregunta4.png"],

        // PREGUNTA 5
        ["Pregunta 5", "pregunta5.png"],
        ["Pregunta 5 (2)", "pregunta5(2).png"],

        // PREGUNTA 6
        ["Pregunta 6", "pregunta6.png"],
        ["Pregunta 6 (2)", "pregunta6(2).png"],
        ["Detalle 5", "detalle5.png"],
        ["Detalle 6", "detalle6.png"],

        // PREGUNTA 7
        ["Pregunta 7", "pregunta7.png"],
        ["Pregunta 7 (2)", "pregunta7(2).png"],
        ["Detalle 7", "detalle7.png"],

        // PREGUNTA 8
        ["Pregunta 8", "pregunta8.png"],
        ["Pregunta 8 (2)", "pregunta8(2).png"],
        ["Detalle 1", "detalle1.png"],
        ["Detalle 8", "detalle8.png"],

        // PREGUNTA 9
        ["Pregunta 9", "pregunta9.png"],

        // PREGUNTA 10
        ["Pregunta 10", "pregunta10.png"]

    ];

    // FUNCIÓN PARA MOSTRAR LAS IMÁGENES
    function mostrarReportes(lista, contenedorId) {

        const contenedor =
            document.getElementById(contenedorId);

        lista.forEach(([titulo, archivo]) => {

            const seccion =
                document.createElement("div");

            seccion.className = "dashboard";

            const encabezado =
                document.createElement("h3");

            encabezado.textContent = titulo;

            const imagen =
                document.createElement("img");

            imagen.src = encodeURI(archivo);
            imagen.alt = titulo;
            imagen.loading = "lazy";

            imagen.onerror = function() {

                this.style.display = "none";

                const aviso =
                    document.createElement("p");

                aviso.className = "error";

                aviso.textContent =
                    "No se encontró la imagen: " + archivo;

                seccion.appendChild(aviso);
            };

            seccion.appendChild(encabezado);
            seccion.appendChild(imagen);
            contenedor.appendChild(seccion);

        });
    }

    // MOSTRAR PÁGINAS INICIALES
    mostrarReportes(
        paginasIniciales,
        "paginas-iniciales"
    );

    // MOSTRAR PREGUNTAS Y DETALLES
    mostrarReportes(
        reportes,
        "reportes"
    );

</script>

</body>
</html>
