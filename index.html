
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI - Grupo 5 PUCP 2026</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 { color: #203864; }

        .dashboard {
            max-width: 1250px;
            margin: 25px auto;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .dashboard h2 {
            color: #203864;
            font-size: 20px;
        }

        .dashboard img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

<h1>Dashboard Power BI - Grupo 5 PUCP 2026</h1>

<main id="reportes"></main>

<script>
    const reportes = [
        ["Pregunta 1", "pregunta1.png"],
        ["Pregunta 1 (2)", "pregunta1(2).png"],
        ["Detalle 1", "detalle1.png"],
        ["Detalle 8", "detalle8.png"],
        ["Pregunta 2", "pregunta2.png"],
        ["Pregunta 3", "pregunta3.png"],
        ["Pregunta 4", "pregunta4.png"],
        ["Pregunta 5", "pregunta5.png"],
        ["Pregunta 6", "pregunta6.png"],
        ["Pregunta 7", "pregunta7.png"],
        ["Pregunta 8", "pregunta8.png"],
        ["Pregunta 9", "pregunta9.png"],
        ["Pregunta 10", "pregunta10.png"]
    ];

    const contenedor = document.getElementById("reportes");

    reportes.forEach(([titulo, archivo]) => {
        const seccion = document.createElement("section");
        seccion.className = "dashboard";

        const encabezado = document.createElement("h2");
        encabezado.textContent = titulo;

        const imagen = document.createElement("img");
        imagen.src = encodeURI(archivo);
        imagen.alt = titulo;
        imagen.loading = "lazy";

        seccion.appendChild(encabezado);
        seccion.appendChild(imagen);
        contenedor.appendChild(seccion);
    });
</script>

</body>
</html>
